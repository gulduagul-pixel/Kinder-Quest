<!-- Professional Header / Navigation Bar -->
<header class="site-header">
    <div class="header-container">
        <!-- Logo -->
        <a href="index.html" class="logo">
            <div class="logo-badge">⭐</div>
            <div class="logo-text">
                <h2>Little Stars</h2>
                <span>Kindergarten & Preschool</span>
            </div>
        </a>

        <!-- Navigation Links -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="courses.html">Our Courses</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <!-- Header Action Buttons -->
        <div class="header-actions">
            <button class="btn-visit" id="openVisitModalBtn" type="button">
    <i class="fa-solid fa-calendar-days"></i> Book a Visit
</button>
            <button class="btn-enroll" id="openEnrollModalBtn">
                <i class="fa-solid fa-heart"></i> Enroll Now
            </button>
        </div>
    </div>
</header>

<!-- BOOK A VISIT MODAL (Global for all pages) -->
<div class="modal-overlay" id="visitModal">
    <div class="modal-container">
        <div class="modal-header">
            <div class="modal-badge-title">
                <div class="modal-teddy-icon">🧸</div>
                <div class="modal-title-text">
                    <span>GUIDED FAMILY TOUR</span>
                    <h3>Book a School Visit! 🏫</h3>
                </div>
            </div>
            <div class="modal-close-btn" id="closeVisitModalBtn">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>

        <div class="modal-banner-note">
            <i class="fa-solid fa-location-dot"></i> Complimentary 45-minute private guided tour with student snack tasting!
        </div>

        <form class="modal-form" onsubmit="event.preventDefault(); alert('Tour booked successfully!');">
            <div class="form-row">
                <div class="form-group">
                    <label>Parent Name *</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" placeholder="Full name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number *</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" placeholder="(555) 000-0000" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address *</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" placeholder="name@email.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Child's Approximate Age</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-child"></i>
                        <select>
                            <option>3 years old (Nursery)</option>
                            <option>2 years old (Playgroup)</option>
                            <option>4 years old (KG-1)</option>
                            <option>5 years old (KG-2)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Preferred Date *</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-calendar"></i>
                        <input type="date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Time Slot *</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-clock"></i>
                        <select>
                            <option>09:30 AM (Class in session)</option>
                            <option>11:00 AM (Storytime hour)</option>
                            <option>03:30 PM (Afternoon playtime)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="modal-footer-actions">
                <button type="button" class="btn-modal-cancel" id="cancelVisitModalBtn">Cancel</button>
                <button type="submit" class="btn-modal-confirm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Confirm Tour Booking
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Global Script to handle header buttons dynamically since header is fetched -->
<script>
    document.addEventListener('click', function(e) {
        // Open Visit Modal
        if (e.target.closest('#openVisitModalBtn')) {
            const visitModal = document.getElementById('visitModal');
            if (visitModal) visitModal.classList.add('active');
        }
        // Close Visit Modal
        if (e.target.closest('#closeVisitModalBtn') || e.target.closest('#cancelVisitModalBtn') || e.target.matches('#visitModal')) {
            const visitModal = document.getElementById('visitModal');
            if (visitModal && (e.target === visitModal || e.target.closest('#closeVisitModalBtn') || e.target.closest('#cancelVisitModalBtn'))) {
                visitModal.classList.remove('active');
            }
        }
    });
</script>
